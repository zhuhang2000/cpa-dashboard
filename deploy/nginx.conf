# /etc/nginx/conf.d/api-portal.conf
# After `nginx -t && systemctl reload nginx`, run `certbot --nginx -d console.example.com` for HTTPS.
server {
    listen 80;
    server_name console.example.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18400;
        proxy_http_version 1.1;
        # The portal checks Host/Origin for CSRF and uses these for client IP and the Secure cookie flag.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
